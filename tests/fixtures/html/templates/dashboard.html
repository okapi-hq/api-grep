{% extends "base.html" %}
{% block content %}
<form action="{{ url_for('settings') }}" method="post">
  <input name="theme">
</form>
<script>
  const API = "{{ config.API_URL }}";
  const userId = {{ current_user.id }};
  {% if current_user.is_admin %}
  fetch("https://api.posthog.example.com/admin", { method: "POST" });
  {% endif %}

  $.ajax({ url: "https://api.mailchimp.com/3.0/lists/abc/members", type: "POST", data: { email_address: "a@b.c" } });

  fetch(`/api/users/${userId}/stats`).then((r) => r.json());
</script>
{% endblock %}
<script>
  fetch("{{ config.API_URL }}/v1/reports", { method: "POST" });
  fetch(`{% url 'api:items' %}?page=2`);
</script>
