spring:
  profiles:
    active: ${APP_PROFILE:staging}
  config:
    import: optional:configserver:${CONFIG_URL:http://config.internal:8888},optional:classpath:llm.properties
  ai:
    openai:
      chat:
        options:
          model: gpt-4o-mini
