[versions]
retrofit = "2.11.0"
firebaseBom = "33.5.1"

[libraries]
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
sentry-android = "io.sentry:sentry-android:7.16.0"
junit = "junit:junit:4.13.2"

[bundles]
network = ["retrofit", "retrofit-converter-gson"]

[plugins]
android-application = { id = "com.android.application", version = "8.7.0" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version = "2.0.21" }
